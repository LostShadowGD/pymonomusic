[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymonomusic"
version = "1.0.1"
description = "Python bindings for the Monochrome Tracks API."
readme = "README.md"
authors = [{ name = "lostssss", email = "imaginegameservice@gmail.com" }]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["music", "downloader"]
dependencies = [
    "requests>=2.0.0",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/LostShadowGD/pymonomusic"